<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Overlay — Jaguars Sectionals</title>
    <link rel="stylesheet" href="../../css/header-structure.css">
    <style>
:root { --green:#103e2d; --gold:#e8b949; --ink:#081d17; --white:#fffdf2; }
body {font-family:Arial,Helvetica,sans-serif;color:var(--white)}
.header-content,.timer-content,.lane-content,.lineup-content,.split-content {background:linear-gradient(110deg,#173f30,#081d17);border:1px solid #65836a;border-bottom:3px solid var(--gold);box-shadow:0 4px 12px #0005}
.visible,.appearing {animation:reveal .3s ease-out forwards}
.hiding,.exploding {animation:exit .25s ease-in forwards}
@keyframes reveal {from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translate(0)}}
@keyframes exit {from{opacity:1;transform:translate(0)}to{opacity:0;transform:translateX(16px)}}
.brick-fragment {display:none}.lane-indicator.brick-explode{animation:none;visibility:hidden}
.placeholder-container,.placeholder-content {display:none}
@media(prefers-reduced-motion:reduce){.visible,.appearing{animation-duration:1ms}.hiding,.exploding{animation-duration:1ms}}

.header-container {top:12px;left:24px;right:24px;height:78px;gap:6px}
#eventBox{width:142px}#heatBox{width:125px}#timerBox{width:310px}
.header-content{padding:0 20px}.label{font-size:13px;letter-spacing:2px;color:#d5decf}.value{font-size:36px;font-weight:900;color:var(--gold)}
#nameContent{background:linear-gradient(110deg,#1a503a,#0b291f)}
.event-name{font-size:29px;font-weight:800;letter-spacing:1px}
.meet-strip {position:absolute;top:90px;left:24px;padding:9px 18px;background:#081d17;display:flex;gap:22px;border-left:3px solid var(--gold);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.meet-strip .meet-title{font-size:20px;font-weight:800;color:var(--gold)}
.meet-strip{align-items:center}
</style>
</head>
<body>
    <!-- Placeholder shown until first data received -->
    <div class="placeholder-container" id="placeholder">
        <div class="placeholder-box event header-content visible">
            <span class="placeholder-text">Waiting...</span>
        </div>
        <div class="placeholder-box heat header-content visible">
            <span class="placeholder-text">Waiting...</span>
        </div>
        <div class="placeholder-box name header-content visible">
            <span class="placeholder-text">Waiting for data...</span>
        </div>
        <div class="placeholder-box timer header-content visible">
            <span class="placeholder-text">0:00.0</span>
        </div>
    </div>

    <div class="header-container">
        <div class="header-box fixed" id="eventBox">
            <div class="header-content" id="eventContent">
                <span class="label">Event</span>
                <span class="value" id="eventNumber"></span>
            </div>
        </div>
        <div class="header-box fixed" id="heatBox">
            <div class="header-content" id="heatContent">
                <span class="label">Heat</span>
                <span class="value" id="heatNumber"></span>
            </div>
        </div>
        <div class="header-box stretch" id="nameBox">
            <div class="header-content" id="nameContent">
                <div class="event-name-wrapper" id="eventNameWrapper">
                    <div class="event-name-track" id="eventNameTrack">
                        <span class="event-name" id="eventName"></span>
                        <span class="event-name event-name-copy" id="eventNameCopy"></span>
                    </div>
                </div>
            </div>
        </div>
        <!-- Empty spacer where timer used to be -->
        <div class="header-box fixed" id="timerBox" style="visibility: hidden;"></div>
    </div>

    <div class="meet-strip"><span class="meet-title">WIAA Girls Swim &amp; Dive · D2 Sectional</span><span>November 6–7, 2026</span></div>
    <script src="../../js/overlay-core.js"></script>
    <script src="../../js/header-overlay.js"></script>
    <script>
        if (new URLSearchParams(location.search).has('preview')) {
            // Preview stays local to its parent; never broadcasts demo data to OBS.
            window.previewReceive = processHeaderData;
        } else {
            SwimOverlay.init({ onData: processHeaderData, numLanes: 8 });
        }
    </script>
</body>
</html>
