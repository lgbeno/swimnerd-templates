<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <title>Lane Overlay — Jaguars Sectionals</title>
    <link rel="stylesheet" href="../../css/lane-structure.css">
    <style>
:root { --green:#103e2d; --gold:#e8b949; --ink:#081d17; --white:#fffdf2; }
body {font-family:Arial,Helvetica,sans-serif;color:var(--white)}
.header-content,.timer-content,.lane-content,.lineup-content,.split-content {background:linear-gradient(110deg,#173f30,#081d17);border:1px solid #65836a;border-bottom:3px solid var(--gold);box-shadow:0 4px 12px #0005}
.visible,.appearing {animation:reveal .3s ease-out forwards}
.hiding,.exploding {animation:exit .25s ease-in forwards}
@keyframes reveal {from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translate(0)}}
@keyframes exit {from{opacity:1;transform:translate(0)}to{opacity:0;transform:translateX(16px)}}
.brick-fragment {display:none}.lane-indicator.brick-explode{animation:none;visibility:hidden}
.placeholder-container,.placeholder-content {display:none}
@media(prefers-reduced-motion:reduce){.visible,.appearing{animation-duration:1ms}.hiding,.exploding{animation-duration:1ms}}

.lanes-container{padding:4px 0}.lane-box{height:calc((100vh - 8px)/8 - 5px);margin:2.5px 0}
.lane-content,.lineup-content {width:calc(100% - 58px);padding:0 12px;border:1px solid #ffffff30;border-left:7px solid var(--team-primary,#72827c);border-bottom:1px solid #ffffff30;border-radius:3px}
.lineup-info {padding:0 4px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.lineup-name,.swimmer-name{font-size:23px;letter-spacing:.5px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lineup-name{margin:0}.lineup-team,.result-team{font-size:13px;font-weight:700;letter-spacing:.5px;color:#fff;padding:3px 8px;background:var(--team-primary,#394c44);border-right:3px solid var(--team-secondary,#bdc7c1);border-radius:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-info{padding:0;min-width:0;gap:12px}.athlete{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;align-items:flex-start}.swimmer-name{font-size:21px}
.final-time{font-size:35px;font-family:Arial,sans-serif;font-weight:900;letter-spacing:-1px;min-width:156px;color:white;flex-shrink:0;font-variant-numeric:tabular-nums}
.place-indicator{font-size:25px;min-width:52px;margin-right:10px;color:#d4ded8}.first-place .place-indicator{color:var(--gold)}.second-place .place-indicator{color:#d9e4ef}.third-place .place-indicator{color:#eeb78b}
.lane-content.first-place{background:linear-gradient(100deg,#3f3b20,#102a20 45%);border-top-color:#e8b94988}
.lane-indicator{right:0;width:50px;height:54px;border-radius:3px;background:#103e2d;border:1px solid #69826a;border-bottom:3px solid var(--gold);font-size:27px;color:var(--gold)}
.split-content{right:58px;padding:0 18px;border-radius:3px}.split-time{font-size:35px;font-weight:800}.split-content:before{content:'SPLIT';font-size:11px;letter-spacing:2px;color:var(--gold);margin-right:15px}
</style>
</head>

    <script>
        if (new URLSearchParams(location.search).has('preview')) {
            // Preview stays local to its parent; never broadcasts demo data to OBS.
            window.previewReceive = processJaguarLanes;
        } else {
            SwimOverlay.init({ onData: processJaguarLanes, numLanes: 8 });
        }
