<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Overlay — Jaguars Sectionals</title>
    <link rel="stylesheet" href="../../css/timer-structure.css">
    <style>
:root { --green:#103e2d; --gold:#e8b949; --ink:#081d17; --white:#fffdf2; }
body {font-family:Arial,Helvetica,sans-serif;color:var(--white)}
.header-content,.timer-content,.lane-content,.lineup-content,.split-content {background:linear-gradient(110deg,#173f30,#081d17);border:1px solid #65836a;border-bottom:3px solid var(--gold);box-shadow:0 4px 12px #0005}
.visible,.appearing {animation:reveal .3s ease-out forwards}
.hiding,.exploding {animation:exit .25s ease-in forwards}
@keyframes reveal {from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translate(0)}}
@keyframes exit {from{opacity:1;transform:translate(0)}to{opacity:0;transform:translateX(16px)}}
.brick-fragment {display:none}.lane-indicator.brick-explode{animation:none;visibility:hidden}
.placeholder-container,.placeholder-content {display:none}
@media(prefers-reduced-motion:reduce){.visible,.appearing{animation-duration:1ms}.hiding,.exploding{animation-duration:1ms}}

.timer-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.timer-content{width:100%;height:100%;padding:10px 16px;gap:10px;background:#081d17}
.timer-label{font-size:11px;letter-spacing:2px;color:var(--gold);margin:0}.running-time{font-size:44px;letter-spacing:-1px;font-weight:900;color:white}
</style>
</head>
<body>
    <div class="timer-container">
        <!-- Placeholder shown until first data received -->
        <div class="placeholder-content timer-content visible" id="placeholder">
            <span class="placeholder-text">Waiting for data...</span>
        </div>

        <div class="timer-content" id="timerContent">
            <span class="timer-label">TIME</span>
            <span class="running-time" id="runningTime"></span>
        </div>
    </div>

    <script src="../../js/overlay-core.js"></script>
    <script src="../../js/timer-overlay.js"></script>
    <script>
        if (new URLSearchParams(location.search).has('preview')) {
            // Preview stays local to its parent; never broadcasts demo data to OBS.
            window.previewReceive = processTimerData;
        } else {
            SwimOverlay.init({ onData: processTimerData, numLanes: 8 });
        }
    </script>
</body>
</html>
