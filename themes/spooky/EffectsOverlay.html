<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spooky Spectacular — Full-screen Effects</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; pointer-events: none; }
    .definitions { position: absolute; width: 0; height: 0; overflow: hidden; }
    #stage { position: absolute; inset: 0; overflow: hidden; }
    .effect { position: absolute; pointer-events: none; }
    .ghost { left: -220px; top: 25%; width: clamp(90px, 10vw, 200px); animation: ghostJourney 9s linear both; filter: drop-shadow(0 0 14px #c9d9ff66); }
    .ghost svg { width: 100%; animation: bob 2.3s ease-in-out infinite; }
    .ghost.friend { top: 41%; width: clamp(65px, 7vw, 135px); animation-delay: .9s; }
    @keyframes ghostJourney { 0% { transform: translateX(0); opacity: 0; } 8%, 86% { opacity: .9; } 100% { transform: translateX(calc(100vw + 440px)); opacity: 0; } }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-25px) rotate(7deg); } }
    .frank { left: 9%; bottom: -8px; width: clamp(130px, 15vw, 285px); animation: peek 10s ease-in-out both; filter: drop-shadow(0 6px 8px #0007); }
    .frank svg { width: 100%; overflow: visible; }
    .wave { transform-origin: 164px 152px; animation: wave .8s ease-in-out infinite alternate; }
    .blink { transform-origin: 100px 82px; animation: blink 4s infinite; }
    @keyframes peek { 0%, 100% { transform: translateY(105%) rotate(-8deg); } 17%, 83% { transform: translateY(0) rotate(0); } }
    @keyframes wave { to { transform: rotate(-28deg); } }
    @keyframes blink { 0%, 43%, 49%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }
    .spider { left: 5%; top: 0; width: clamp(150px, 19vw, 365px); height: 58%; animation: spiderVisit 10s ease-in-out both; }
    .spider svg { width: 100%; height: 100%; overflow: visible; }
    .web { fill: none; stroke: #eee1ff; stroke-width: 1.2; opacity: .62; stroke-dasharray: 650; stroke-dashoffset: 650; animation: weave 3s ease-out forwards; }
    .spider-body { animation: descend 3s cubic-bezier(.3,0,.3,1) both; }
    .silk { stroke: #eee1ff; stroke-width: 1.4; }
    @keyframes weave { to { stroke-dashoffset: 0; } }
    @keyframes descend { from { transform: translateY(-230px); } to { transform: translateY(0); } }
    @keyframes spiderVisit { 0% { opacity: 0; } 6%, 85% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-35%); } }
    .bat { left: -120px; top: 19%; width: clamp(55px, 6vw, 110px); animation: batJourney 7s linear both; filter: drop-shadow(0 0 3px #debfff90); }
    .bat svg { width: 100%; animation: flutter .32s ease-in-out infinite alternate; }
    @keyframes batJourney { from { transform: translate(0, 15vh); } to { transform: translate(calc(100vw + 240px), -5vh); } }
    @keyframes flutter { to { transform: scaleY(.5) rotate(8deg); } }

    /* Shared paths keep the cast lightweight: no video, fonts, or image downloads. */
    .effect svg { display:block; width:100%; height:auto; overflow:visible; }
    .spider svg { height:100%; }
    .traveler { left:-330px; top:24%; width:clamp(150px,16vw,300px); animation:crossing 9s linear both; filter:drop-shadow(0 3px 5px #21132c70); }
    @keyframes crossing { 0% { transform:translateX(0); opacity:0; } 6%,94% { opacity:1; } 100% { transform:translateX(calc(100vw + 660px)); opacity:0; } }
    .witch svg { animation:bob 1.6s ease-in-out infinite; }
    .spark { position:absolute; color:#ffe5a1; font-size:35px; animation:sparkle 1s ease-in-out infinite alternate; }
    .spark:nth-child(2) { left:-30px; top:65%; animation-delay:.2s; }.spark:nth-child(3) { left:-75px; top:75%; animation-delay:.5s; }
    @keyframes sparkle { to { opacity:.1; transform:scale(.4) rotate(70deg); } }
    .pumpkin-roll { top:auto; bottom:3%; width:clamp(85px,9vw,175px); }
    .pumpkin-roll svg { animation:tumble 1.3s ease-in-out infinite; }
    @keyframes tumble { 0%,100% { transform:translateY(0) rotate(-20deg); } 50% { transform:translateY(-50px) rotate(25deg); } }
    .mummy { top:auto; bottom:3%; width:clamp(100px,11vw,210px); }
    .mummy svg { animation:shuffle .45s ease-in-out infinite alternate; }
    @keyframes shuffle { to { transform:translateY(-9px) rotate(4deg); } }
    .bandage { stroke-dasharray:10 4; animation:unravel .6s linear infinite; }
    @keyframes unravel { to { stroke-dashoffset:-28; } }
    .cat { top:auto; bottom:4%; width:clamp(120px,13vw,250px); animation:catPounce 9s ease-in-out both; }
    @keyframes catPounce { 0% { transform:translateX(0); } 25% { transform:translateX(25vw); } 40% { transform:translateX(25vw) scaleY(.85); } 60% { transform:translate(55vw,-20vh) rotate(-12deg); } 78% { transform:translate(75vw,0); } 100% { transform:translateX(calc(100vw + 660px)); } }
    .corner-cameo { left:8%; bottom:0; width:clamp(150px,17vw,325px); animation:peek 9s ease-in-out both; }
    .cauldron .bubble { position:absolute; bottom:55%; left:40%; width:22%; animation:bubbleRise 3s ease-out infinite; }
    .cauldron .bubble:nth-child(2) { left:12%; animation-delay:.6s; }.cauldron .bubble:nth-child(3) { left:65%; animation-delay:1.3s; }
    .bubble::before { content:''; position:absolute; inset:0; border:2px solid #d7ff98; border-radius:50%; background:#aeff6750; }
    .bubble svg { opacity:0; animation:becomeGhost 3s infinite; }
    @keyframes bubbleRise { from { transform:translateY(0) scale(.5); opacity:0; } 20% { opacity:1; } to { transform:translateY(-32vh) scale(1.2); opacity:0; } }
    @keyframes becomeGhost { 35%,80% { opacity:1; } }
    .skeleton svg { animation:boneDance .65s ease-in-out infinite alternate; transform-origin:50% 90%; }
    @keyframes boneDance { to { transform:rotate(12deg) translateY(-15px); } }
    .swimmer-ghost { top:30%; width:clamp(100px,11vw,210px); }
    .swimmer-ghost svg { animation:swimStroke .8s ease-in-out infinite alternate; }
    @keyframes swimStroke { to { transform:translateY(-13px) rotate(12deg); } }
    .particle { left:var(--x); top:-100px; width:clamp(25px,3vw,58px); animation:fall 7s linear both; animation-delay:var(--delay); filter:drop-shadow(0 2px 2px #27153740); }
    .particle svg { animation:spin 2s linear infinite; }
    @keyframes fall { 0% { transform:translate(0,0); opacity:0; } 8%,85% { opacity:1; } 100% { transform:translate(var(--drift),calc(100vh + 200px)); opacity:0; } }
    @keyframes spin { to { transform:rotate(360deg); } }
    .leaf { animation-name:leafSpiral; }
    @keyframes leafSpiral { 0% { opacity:0; transform:translate(0,0); } 15%,80% { opacity:1; } 40% { transform:translate(14vw,40vh); } 70% { transform:translate(-4vw,65vh); } 100% { opacity:0; transform:translate(12vw,calc(100vh + 150px)); } }
    .monster { bottom:-8px; left:var(--x); width:clamp(100px,11vw,210px); color:var(--skin); animation:peek 8s ease-in-out both; animation-delay:var(--delay); }
    .monster .monster-face { animation:revealMonster 8s both; }
    @keyframes revealMonster { 0%,15% { opacity:0; } 30%,100% { opacity:1; } }
    .portal { left:20%; bottom:5%; width:clamp(160px,20vw,380px); height:clamp(220px,26vw,500px); animation:portalVisit 9s ease-in-out both; }
    .portal-ring { position:absolute; inset:0; border:8px solid #c2a0ff; border-radius:50%; background:radial-gradient(ellipse,#473b6966,#8b42dc33 60%,#e5bcff99); box-shadow:0 0 22px #a461ff,inset 0 0 24px #d4a5ff; animation:portalPulse 1.5s ease-in-out infinite alternate; }
    .portal-pumpkin { position:absolute; width:80%; left:10%; bottom:0; animation:portalHop 9s ease-in-out both; }
    .pumpkin-wave { transform-origin:155px 112px; animation:wave .8s ease-in-out infinite alternate; }
    @keyframes portalVisit { 0%,100% { opacity:0; transform:scale(.1); } 15%,85% { opacity:1; transform:scale(1); } }
    @keyframes portalPulse { to { transform:scaleX(.92); opacity:.7; } }
    @keyframes portalHop { 0%,15%,100% { transform:scale(.1); opacity:0; } 35% { transform:translateY(-50px) scale(1); opacity:1; } 50%,85% { transform:translateY(0) scale(1); opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
        .ghost { left: 8%; opacity: .9; }
        .ghost.friend { left: 22%; }
        .frank { transform: none; }
        .web { stroke-dashoffset: 0; }
        .bat { left: 25%; }
        .traveler { left:15%; }
        .particle { top:25%; }
        .monster { bottom:0; }
        .bubble { display:none; }
    }
</style>

<script>
(() => {
    const stage = document.getElementById('stage');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const catalog = [
        ['ghosts','Ghost parade'], ['frankenstein','Frankenstein wave'], ['spider','Spider web'],
        ['bats','Bat flock'], ['witch','Witch flyby'], ['pumpkins','Pumpkin tumble'],
        ['mummy','Mummy unravel'], ['cat','Black cat'], ['cauldron','Cauldron bubbles'],
        ['skeleton','Skeleton dance'], ['swimmers','Haunted swim team'], ['leaves','Autumn whirlwind'],
        ['candy','Candy shower'], ['monsters','Monster peekaboo'], ['portal','Pumpkin portal']
    ].map(([id, name]) => ({ id, name }));
    const sequence = catalog.map(item => item.id);
    let bag = [], lastPick;
    function playNext() {
        if (!bag.length) {
            bag = [...sequence];
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
            // Avoid a back-to-back repeat across two complete rounds, too.
            if (bag[bag.length - 1] === lastPick) [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
        }
        lastPick = bag.pop();
        play(lastPick);
        return lastPick;
    }
    let cleanup, cycle;
    let enabled = new URLSearchParams(location.search).get('autoplay') !== '0';
    const views = { 'ghost-art': '0 0 180 220', 'frank-art': '0 0 220 290', 'bat-art': '0 0 140 80', 'pumpkin-art':'0 0 180 170', 'witch-art':'0 0 300 220', 'mummy-art':'-90 0 260 250', 'cat-art':'0 0 240 170', 'cauldron-art':'0 0 220 200', 'skeleton-art':'0 0 210 300', 'swim-ghost-art':'0 0 180 220', 'leaf-art':'0 0 90 100', 'candy-art':'0 0 100 70', 'corn-art':'0 0 80 100', 'monster-art':'0 0 180 200' };
    const art = id => `<svg viewBox="${views[id]}" aria-hidden="true"><use href="#${id}"/></svg>`;
    function add(className, content, styles = {}) {
        const element=document.createElement('div');
        element.className=`effect ${className}`;
        element.innerHTML=content;
        Object.assign(element.style,styles);
        stage.append(element);
        return element;
    }
    function play(type) {
        if (!sequence.includes(type)) return;
        clearTimeout(cleanup);
        stage.replaceChildren(); // One vignette at a time; never accumulate particles.
        if (type === 'ghosts') {
            stage.innerHTML = `<div class="effect ghost">${art('ghost-art')}</div><div class="effect ghost friend">${art('ghost-art')}</div>`;
        } else if (type === 'frankenstein') {
            stage.innerHTML = `<div class="effect frank">${art('frank-art')}</div>`;
        } else if (type === 'bats') {
            for (let i = 0; i < 5; i++) {
                const bat = document.createElement('div');
                bat.className = 'effect bat';
                bat.style.top = `${19 + i * 3}%`;
                bat.style.animationDelay = `${i * .4}s`;
                bat.innerHTML = art('bat-art');
                stage.append(bat);
            }
        } else if (type === 'spider') {
            stage.innerHTML = `<div class="effect spider"><svg viewBox="0 0 300 480" preserveAspectRatio="xMinYMin meet">
                <path class="web" d="M0 0L270 0M0 0L252 78M0 0L202 148M0 0L130 210M0 0L52 240M0 0L0 260M65 0Q57 14 60 19Q42 20 48 35Q29 33 31 50Q11 44 12 58Q0 50 0 65M130 0Q114 30 120 38Q85 40 96 70Q58 65 62 100Q22 90 25 115Q0 103 0 130M195 0Q172 45 180 56Q127 60 144 105Q88 97 93 150Q34 135 38 173Q0 154 0 195M260 0Q230 60 240 75Q170 80 192 140Q116 130 124 200Q45 180 50 230Q0 206 0 260"/>
                <g class="spider-body"><path class="silk" d="M152 -260V308"/>
                <g fill="none" stroke="#bda0dd" stroke-width="5" stroke-linecap="round"><path d="M140 327L112 308L100 324M137 336L107 333L96 347M139 346L114 359L109 374M164 327L190 308L202 324M166 337L196 333L208 347M164 346L188 359L193 374"/></g>
                <ellipse cx="152" cy="339" rx="24" ry="29" fill="#5b4075" stroke="#c3a3eb" stroke-width="2"/><circle cx="142" cy="328" r="8" fill="#fff3d2"/><circle cx="162" cy="328" r="8" fill="#fff3d2"/><g fill="#241c36"><circle cx="144" cy="329" r="4"/><circle cx="160" cy="329" r="4"/></g><path d="M144 346Q152 354 160 346" fill="none" stroke="#ffcc83" stroke-width="3" stroke-linecap="round"/></g></svg></div>`;

        } else if (type === 'witch') {
            stage.innerHTML = `<div class="effect traveler witch">${art('witch-art')}<span class="spark">✦</span><span class="spark">✧</span></div>`;
        } else if (type === 'pumpkins') {
            for (let i=0;i<3;i++) add('traveler pumpkin-roll', art('pumpkin-art'), { animationDelay:`${i*.35}s`, bottom:`${3+i*4}%` });
        } else if (type === 'mummy' || type === 'cat') {
            add(`traveler ${type}`, art(`${type}-art`));
        } else if (type === 'cauldron') {
            add('corner-cameo cauldron', `${art('cauldron-art')}<div class="bubble">${art('ghost-art')}</div><div class="bubble">${art('ghost-art')}</div><div class="bubble">${art('ghost-art')}</div>`);
        } else if (type === 'skeleton') {
            add('corner-cameo skeleton', art('skeleton-art'));
        } else if (type === 'swimmers') {
            for (let i=0;i<3;i++) add('traveler swimmer-ghost',art('swim-ghost-art'), { top:`${24+i*11}%`, animationDelay:`${i*.25}s` });
        } else if (type === 'leaves' || type === 'candy') {
            for (let i=0;i<20;i++) {
                const symbol = type === 'leaves' ? 'leaf-art' : i%2 ? 'candy-art' : 'corn-art';
                const particle = add(`particle ${type === 'leaves' ? 'leaf' : ''}`,art(symbol));
                // Keep candy at the sides; leaves form a loose spiral across the pool.
                particle.style.setProperty('--x', `${type === 'candy' ? (i%2 ? 85+i%10 : i%10) : i*4.7}%`);
                particle.style.setProperty('--delay', `${(i%7)*.35}s`);
                particle.style.setProperty('--drift', `${i%2 ? -8 : 8}vw`);
                particle.style.color=['#ffa24c','#c0a0ea','#edc76c'][i%3];
            }
        } else if (type === 'monsters') {
            for (let i=0;i<3;i++) {
                const monster=add('monster',art('monster-art'));
                monster.style.setProperty('--x',`${5+i*19}%`);
                monster.style.setProperty('--delay',`${i*.6}s`);
                monster.style.setProperty('--skin',['#b8d989','#b99adf','#f1b772'][i]);
            }
        } else if (type === 'portal') {
            add('portal',`<div class="portal-ring"></div><div class="portal-pumpkin"><svg viewBox="-35 0 250 190"><path d="M22 117L-14 135" stroke="#96b775" stroke-width="10" stroke-linecap="round"/><g class="pumpkin-wave"><path d="M155 112L194 97L199 71" stroke="#96b775" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M198 77L187 63M200 77L207 57" stroke="#badd95" stroke-width="7" stroke-linecap="round"/></g><use href="#pumpkin-art" width="180" height="170"/></svg></div>`);
        }
        cleanup = setTimeout(() => stage.replaceChildren(), motion.matches ? 4500 : 10000);
    }
    function stop() {
        enabled = false;
        clearInterval(cycle);
        clearTimeout(cleanup);
        stage.replaceChildren();
    }
    function start() {
        stop();
        enabled = true;
        if (motion.matches || document.hidden) return;
        playNext();
        cycle = setInterval(playNext, 20000);
    }
    window.SpookyEffects = { play, playNext, stop, start, catalog };
    motion.addEventListener('change', () => { if (enabled) start(); });
    document.addEventListener('visibilitychange', () => { if (enabled) start(); });
    if (enabled) start();
})();
</script>
</body>
</html>
