<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lane Overlay — Spooky Splash Spectacular</title>
    <link rel="stylesheet" href="../../css/lane-structure.css">
    <style>
        :root { --ink:#130e20; --orange:#ff9b38; --gold:#ffdc89; --violet:#b59aff; --green:#c2f790; }
        body { font-family: 'Trebuchet MS', Arial, sans-serif; color:#fff4df; }
        .placeholder-text { color:var(--gold); font-size:12px; letter-spacing:2px; }
        @keyframes materialize { from { opacity:0; transform:translateY(12px) scale(.96); } to { opacity:1; transform:none; } }
        @keyframes vanish { from { opacity:1; transform:none; } to { opacity:0; transform:translateY(10px) scale(.96); } }
        @keyframes float { 50% { transform:translateY(-4px) rotate(4deg); } }

        .lanes-container { padding:16px 0; }
        .lane-box { overflow:visible; height:calc((100vh - 32px) / 8 - 8px); }
        .lane-content,.lineup-content { left:16px; width:calc(100% - 86px); padding:0 14px; border:1px solid #8f6fb866; border-left:3px solid var(--violet); border-radius:7px 0 0 7px; background:radial-gradient(ellipse at 0 0,#65407760,transparent 70%),linear-gradient(100deg,#201629f5,#171221ed); box-shadow:inset 0 1px #ffffff13,0 4px 10px #0005; }
        .lineup-content::before { content:''; width:24px; height:29px; flex-shrink:0; margin:0 10px 0 2px; background:radial-gradient(ellipse at 35% 40%,#251930 0 2px,transparent 3px),radial-gradient(ellipse at 65% 40%,#251930 0 2px,transparent 3px),linear-gradient(#f5eaff,#b7a1d7); border-radius:50% 50% 3px 3px; clip-path:polygon(0 0,100% 0,100% 100%,75% 85%,50% 100%,25% 85%,0 100%); animation:float 3s ease-in-out infinite; }
        .lineup-info,.lane-info { min-width:0; gap:12px; padding:0 8px; }
        .lineup-name,.swimmer-name { font-size:clamp(13px,2.8vw,22px); font-weight:bold; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .lineup-name { margin:0; flex:1; }
        .lineup-team { margin-left:auto; color:#dac5f4; background:#b49aff15; border:1px solid #b49aff30; border-radius:4px; padding:5px 9px; font-size:12px; white-space:nowrap; max-width:30%; overflow:hidden; text-overflow:ellipsis; }
        .place-indicator { min-width:54px; margin:0; font:bold 25px Georgia,serif; color:var(--violet); }
        .swimmer-name { flex:1; }
        .final-time { min-width:0; flex-shrink:0; font:700 clamp(22px,4.5vw,34px)/1.1 'Courier New',monospace; color:#fff7df; letter-spacing:0; font-variant-numeric:tabular-nums; text-shadow:0 2px 3px #000; }
        .lane-content.first-place { border-color:#ffc469; background:radial-gradient(ellipse at 0 50%,#a84d2355,transparent 80%),linear-gradient(90deg,#482a1df5,#211724f5); box-shadow:inset 0 1px #ffe7a533,0 0 18px #ff9b3820; }
        .first-place .place-indicator { color:var(--gold); text-shadow:0 0 12px #ffb54380; }
        .lane-content.second-place { border-left-color:#d9e1f2; } .second-place .place-indicator { color:#d9e1f2; }
        .lane-content.third-place { border-left-color:#e7a87f; } .third-place .place-indicator { color:#e7a87f; }
        .lane-content.visible,.lineup-content.visible,.split-content.visible { animation:unveil .5s cubic-bezier(.16,1,.3,1) both; }
        .lane-content.hiding { animation:vanish .22s both; }
        .lineup-content.hiding { animation:ghostExit .3s both; }
        .split-content.hiding { animation:retract .3s both; }
        @keyframes unveil { from { transform:translateX(35px); clip-path:inset(0 0 0 100%); opacity:0; } to { transform:none; clip-path:inset(0); opacity:1; } }
        @keyframes retract { from { transform:none; opacity:1; } to { transform:translateX(40px); opacity:0; } }
        @keyframes ghostExit { from { transform:none; opacity:1; } to { transform:scale(1.06); filter:blur(5px); opacity:0; } }
        .lane-indicator { right:12px; width:58px; height:48px; border-radius:44% 44% 42% 42%; border:1px solid #ffba55; background:repeating-radial-gradient(ellipse at 50% 48%,transparent 0 10px,#81330c55 11px 12px,transparent 13px 18px),radial-gradient(ellipse at 45% 25%,#ffcc68,#ec7524 60%,#8f3615); box-shadow:inset 0 -5px 7px #6b220b80,inset 0 2px 2px #ffe7a5,0 0 15px #ff8d3428; color:#fff1ad; font:bold 28px Georgia,serif; text-shadow:0 2px 1px #6b2709,0 0 7px #ffeb64; }
        .lane-indicator::before { content:''; position:absolute; top:-8px; left:27px; width:7px; height:10px; background:linear-gradient(90deg,#607443,#a8bc63); border-radius:5px 1px 0 0; transform:rotate(15deg); }
        .lane-indicator::after { content:''; position:absolute; top:-6px; left:36px; width:12px; height:6px; border-top:2px solid #98b36f; border-radius:50%; transform:rotate(-20deg); }
        .split-content { right:68px; border:1px solid #b0d889; border-radius:6px 0 0 6px; background:linear-gradient(100deg,#1c3025f5,#263727f5); box-shadow:0 0 14px #a5ee7920; }
        .split-time { color:#ddffb8; font:bold 26px 'Courier New',monospace; }
        .placeholder-lane { border:1px solid #745389; border-radius:7px; background:#23192c; }
        .spider-web-container { position:fixed; top:0; left:0; width:125px; height:125px; pointer-events:none; z-index:0; opacity:0; transition:opacity .6s; }
        .spider-web-container.active { opacity:.65; } .spider-web-container.fading { opacity:0; }
        .spider-web-container > svg { width:100%; height:100%; }
        .spider-web-container.active .web-strand,.spider-web-container.active .web-ring { stroke-dasharray:800; stroke-dashoffset:800; animation:weave 2.5s ease both; }
        @keyframes weave { to { stroke-dashoffset:0; } }
        .spider { position:absolute; top:0; left:95px; width:25px; transform-origin:top; }
        .spider-web-container.active .spider { animation:float 3s ease-in-out infinite; }
        @media(max-height:500px) { .lane-indicator { height:32px; width:44px; right:18px; font-size:22px; } .lane-indicator::before { left:20px; } .lineup-content::before { height:22px; width:19px; } .lineup-team { padding:2px 5px; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration:1ms !important; animation-delay:0ms !important; animation-iteration-count:1 !important; transition-duration:1ms !important; }

    <script>
        // Autumn fragment colors
        SwimOverlay.fragmentColors = ['#ff6600', '#8B4513', '#cc5500', '#ff9933'];

        // Spider web trigger — detect when race transitions to 'results'
        let lastDisplayMode = 'lineup';
        let spiderActive = false;

        function showSpiderWeb() {
            if (spiderActive) return;
            spiderActive = true;
            const web = document.getElementById('spiderWeb');
            web.classList.remove('fading');
            web.classList.add('active');
        }

        function hideSpiderWeb() {
            if (!spiderActive) return;
            spiderActive = false;
            const web = document.getElementById('spiderWeb');
            web.classList.remove('active');
            web.classList.add('fading');
            setTimeout(() => {
                web.classList.remove('fading');
            }, 1000);
        }

        function processSpookyLaneData(jsonData) {
            processLaneData(jsonData);
            // The simulation's full-screen effects are coordinated by event changes.
            if (new URLSearchParams(location.search).get('preview') === '1') return;

            // displayMode is set by lane-overlay.js — check for transitions
            if (displayMode === 'results' && lastDisplayMode !== 'results') {
                showSpiderWeb();
            } else if (displayMode !== 'results' && lastDisplayMode === 'results') {
                hideSpiderWeb();
            }
            lastDisplayMode = displayMode;
        }

        if (new URLSearchParams(location.search).get("preview") !== "1") SwimOverlay.init({ onData: processSpookyLaneData, numLanes: 8 });
    </script>
